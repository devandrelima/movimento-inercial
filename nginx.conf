server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "accelerometer=(self), gyroscope=(self)" always;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    # API dos mapas públicos. O nome do serviço é resolvido em tempo de execução (rede interna do projeto),
    # para o Nginx subir mesmo se a API reiniciar e trocar de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /api/ {
        set $norte_api http://norte-inercial-api:3000;
        proxy_pass $norte_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /models/ { try_files $uri =404; }
    location ^~ /wasm/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
